name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System libraries (Electron + Xvfb + xdotool)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnotify4 libnss3 libxss1 libxtst6 xdg-utils \
            libatspi2.0-0 libuuid1 libsecret-1-0 libgbm1 libasound2t64 xvfb xdotool
      - run: npm ci
      - name: Syntax
        run: |
          for f in main.js preload.js src/*.js src/scan/*.js renderer/*.js tests/*.js tests/fixtures/*.js; do
            node --check "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done
      - name: Library scanners, anti-cheat matching, launch commands, quick-settings backend
        run: npm test
      - name: The real app under Xvfb (keys, controller, mouse, launching, anti-cheat warning)
        run: xvfb-run -a -s "-screen 0 1440x900x24" node tests/ui-phase1.test.js
      - name: Home, game page, artwork (stand-in SteamGridDB), startup animation, exit
        run: xvfb-run -a -s "-screen 0 1440x900x24" node tests/ui-phase2.test.js
      - name: Quick settings and on-screen keyboard (stand-in nmcli / wpctl / bluetoothctl)
        run: xvfb-run -a -s "-screen 0 1440x900x24" node tests/ui-phase3.test.js
